<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NodeExamples API Tester</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #333;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px 32px;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p  { font-size: 0.85rem; color: #aab; margin-top: 4px; }

    main { max-width: 900px; margin: 32px auto; padding: 0 16px; }

    .gruppo-titolo {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      margin: 32px 0 10px;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e6ea;
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
    }
    .card-header:hover { background: #f8f9fa; }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 4px;
      min-width: 56px;
      text-align: center;
      color: #fff;
      flex-shrink: 0;
    }
    .badge-GET    { background: #28a745; }
    .badge-POST   { background: #007bff; }
    .badge-PUT    { background: #fd7e14; }
    .badge-DELETE { background: #dc3545; }

    .card-path {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      flex: 1;
    }

    .card-chevron {
      color: #aaa;
      font-size: 0.8rem;
      transition: transform 0.2s;
    }
    .card.open .card-chevron { transform: rotate(180deg); }

    .card-body {
      display: none;
      padding: 0 18px 18px;
      border-top: 1px solid #e2e6ea;
    }
    .card.open .card-body { display: block; }

    .card-desc {
      font-size: 0.85rem;
      color: #555;
      margin: 14px 0 18px;
      line-height: 1.5;
    }

    .params-section { margin-bottom: 14px; }
    .params-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 8px;
    }

    .param-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .param-row label {
      font-size: 0.82rem;
      font-family: 'Courier New', monospace;
      color: #444;
      min-width: 110px;
    }
    .param-row input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #ccd;
      border-radius: 5px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .param-row input:focus { border-color: #007bff; }
    .param-row input.error { border-color: #dc3545; }

    .btn-esegui {
      background: #1a1a2e;
      color: #fff;
      border: none;
      padding: 9px 22px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .btn-esegui:hover { background: #2d2d5e; }
    .btn-esegui:active { transform: scale(0.98); }

    .risposta {
      margin-top: 16px;
      border-radius: 6px;
      overflow: hidden;
      font-size: 0.82rem;
    }
    .risposta-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #2d2d2d;
      color: #eee;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.78rem;
    }
    .status-ok  { background: #28a745; color: #fff; }
    .status-err { background: #dc3545; color: #fff; }

    .risposta pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 14px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.5;
      font-family: 'Courier New', monospace;
    }

    .json-key   { color: #9cdcfe; }
    .json-str   { color: #ce9178; }
    .json-num   { color: #b5cea8; }
    .json-bool  { color: #569cd6; }
    .json-null  { color: #569cd6; }

    .err-inline {
      color: #dc3545;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    #loading {
      text-align: center;
      color: #888;
      margin-top: 80px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<header>
  <h1>NodeExamples — API Tester</h1>
  <p>Interfaccia interattiva per testare tutti gli endpoint del progetto</p>
</header>

<main id="main">
  <p id="loading">Caricamento endpoint...</p>
</main>

<script>
(function () {
  const COLORS = { GET: 'badge-GET', POST: 'badge-POST', PUT: 'badge-PUT', DELETE: 'badge-DELETE' };

  function colorJson(obj) {
    const json = JSON.stringify(obj, null, 2);
    return json.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      function (match) {
        if (/^"/.test(match)) {
          return /:$/.test(match)
            ? '<span class="json-key">' + match + '</span>'
            : '<span class="json-str">' + match + '</span>';
        }
        if (/true|false/.test(match)) return '<span class="json-bool">' + match + '</span>';
        if (/null/.test(match))       return '<span class="json-null">' + match + '</span>';
        return '<span class="json-num">' + match + '</span>';
      }
    );
  }

  function buildCard(ep) {
    const card = document.createElement('div');
    card.className = 'card';

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML =
      '<span class="badge ' + (COLORS[ep.metodo] || '') + '">' + ep.metodo + '</span>' +
      '<span class="card-path">' + ep.endpoint + '</span>' +
      '<span class="card-chevron">▼</span>';
    header.addEventListener('click', function () { card.classList.toggle('open'); });
    card.appendChild(header);

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';

    body.innerHTML = '<p class="card-desc">' + ep.descrizione + '</p>';

    const pathInputs = {};
    const bodyInputs = {};

    if (ep.parametriPath.length > 0) {
      const sec = document.createElement('div');
      sec.className = 'params-section';
      sec.innerHTML = '<div class="params-label">Parametri path</div>';
      ep.parametriPath.forEach(function (p) {
        const row = document.createElement('div');
        row.className = 'param-row';
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.placeholder = ':' + p;
        inp.id = 'path_' + ep.endpoint + '_' + p;
        pathInputs[p] = inp;
        row.innerHTML = '<label>' + p + '</label>';
        row.appendChild(inp);
        sec.appendChild(row);
      });
      body.appendChild(sec);
    }

    if (ep.parametriBody.length > 0) {
      const sec = document.createElement('div');
      sec.className = 'params-section';
      sec.innerHTML = '<div class="params-label">Parametri body</div>';
      ep.parametriBody.forEach(function (p) {
        const row = document.createElement('div');
        row.className = 'param-row';
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.placeholder = p;
        bodyInputs[p] = inp;
        row.innerHTML = '<label>' + p + '</label>';
        row.appendChild(inp);
        sec.appendChild(row);
      });
      body.appendChild(sec);
    }

    const errDiv = document.createElement('div');
    errDiv.className = 'err-inline';
    body.appendChild(errDiv);

    const btn = document.createElement('button');
    btn.className = 'btn-esegui';
    btn.textContent = 'Esegui';
    body.appendChild(btn);

    const rispostaDiv = document.createElement('div');
    rispostaDiv.className = 'risposta';
    rispostaDiv.style.display = 'none';
    body.appendChild(rispostaDiv);

    btn.addEventListener('click', function () {
      errDiv.textContent = '';
      Object.values(pathInputs).forEach(function (i) { i.classList.remove('error'); });

      // Validazione path params
      var missing = [];
      ep.parametriPath.forEach(function (p) {
        if (!pathInputs[p].value.trim()) {
          pathInputs[p].classList.add('error');
          missing.push(p);
        }
      });
      if (missing.length > 0) {
        errDiv.textContent = 'Compila i parametri obbligatori: ' + missing.join(', ');
        return;
      }

      // Costruzione URL
      var url = ep.endpoint;
      ep.parametriPath.forEach(function (p) {
        url = url.replace(':' + p, encodeURIComponent(pathInputs[p].value.trim()));
      });

      // Costruzione body
      var fetchOpts = { method: ep.metodo, headers: {} };
      if (ep.parametriBody.length > 0) {
        var bodyObj = {};
        ep.parametriBody.forEach(function (p) { bodyObj[p] = bodyInputs[p].value; });
        fetchOpts.headers['Content-Type'] = 'application/json';
        fetchOpts.body = JSON.stringify(bodyObj);
      }

      btn.textContent = '...';
      btn.disabled = true;

      fetch(url, fetchOpts)
        .then(function (res) {
          var status = res.status;
          return res.json().then(function (data) {
            var isOk = status >= 200 && status < 300;
            rispostaDiv.style.display = 'block';
            rispostaDiv.innerHTML =
              '<div class="risposta-header">' +
                '<span class="status-badge ' + (isOk ? 'status-ok' : 'status-err') + '">' + status + '</span>' +
                'Risposta' +
              '</div>' +
              '<pre>' + colorJson(data) + '</pre>';
          });
        })
        .catch(function (err) {
          rispostaDiv.style.display = 'block';
          rispostaDiv.innerHTML =
            '<div class="risposta-header"><span class="status-badge status-err">ERR</span>Errore di rete</div>' +
            '<pre>' + err.message + '</pre>';
        })
        .finally(function () {
          btn.textContent = 'Esegui';
          btn.disabled = false;
        });
    });

    card.appendChild(body);
    return card;
  }

  fetch('/catalogRoutes/getAllEndpoints')
    .then(function (res) { return res.json(); })
    .then(function (endpoints) {
      var main = document.getElementById('main');
      main.innerHTML = '';

      // Raggruppa per gruppo
      var gruppi = {};
      endpoints.forEach(function (ep) {
        if (!gruppi[ep.gruppo]) gruppi[ep.gruppo] = [];
        gruppi[ep.gruppo].push(ep);
      });

      Object.keys(gruppi).forEach(function (g) {
        var titolo = document.createElement('div');
        titolo.className = 'gruppo-titolo';
        titolo.textContent = g;
        main.appendChild(titolo);

        gruppi[g].forEach(function (ep) {
          main.appendChild(buildCard(ep));
        });
      });
    })
    .catch(function (err) {
      document.getElementById('loading').textContent =
        'Errore nel caricamento degli endpoint: ' + err.message;
    });
})();
</script>
</body>
</html>
